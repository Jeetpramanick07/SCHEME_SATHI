version: '3.8'

services:
  indic-voice-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: schemesaathi-indic-voice
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - MOCK_VOICE=false
      - HF_HOME=/home/appuser/.cache/huggingface
    volumes:
      - hf_cache:/home/appuser/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  hf_cache:
