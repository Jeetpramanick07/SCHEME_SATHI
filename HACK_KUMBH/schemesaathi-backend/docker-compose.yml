version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: schemesaathi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: schemesaathi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d schemesaathi"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: schemesaathi-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/schemesaathi
      DB_SSL_REJECT_UNAUTHORIZED: "false"
      CORS_ORIGIN: "*"
      API_KEY_CITIZEN: citizen-secret-key
      API_KEY_VOLUNTEER: volunteer-secret-key
      API_KEY_ADMIN: admin-secret-key

volumes:
  pgdata:
