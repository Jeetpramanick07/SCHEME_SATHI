# ==============================================================================
# SchemeSaathi - Render Blueprint Specification
# One-click deployment for Managed PostgreSQL Database, Backend API, and Web App
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Backend Fastify API Service
  # ----------------------------------------------------------------------------
  - type: web
    name: schemesaathi-backend
    runtime: node
    rootDir: HACK_KUMBH/schemesaathi-backend
    buildCommand: pnpm install && pnpm run build
    startCommand: node dist/server.js
    plan: free
    healthCheckPath: /api/v1/meta
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: schemesaathi-postgres
          property: connectionString
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: CORS_ORIGIN
        value: "*"
      - key: API_KEY_CITIZEN
        generateValue: true
      - key: API_KEY_VOLUNTEER
        generateValue: true
      - key: API_KEY_ADMIN
        generateValue: true

  # ----------------------------------------------------------------------------
  # 2. Frontend React / Vite Static Site
  # ----------------------------------------------------------------------------
  - type: web
    name: schemesaathi-web
    runtime: static
    rootDir: HACK_KUMBH/schemesaathi-web
    buildCommand: pnpm install && pnpm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: schemesaathi-backend
          envVarKey: RENDER_EXTERNAL_URL
          value: ${RENDER_EXTERNAL_URL}/api/v1

databases:
  # ----------------------------------------------------------------------------
  # 3. Managed PostgreSQL Database
  # ----------------------------------------------------------------------------
  - name: schemesaathi-postgres
    databaseName: schemesaathi
    user: schemesaathi_user
    plan: free
